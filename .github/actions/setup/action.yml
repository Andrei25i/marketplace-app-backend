name: Setup
description: Installs Node (from .nvmrc), restores the npm cache, installs dependencies, and generates the Prisma Client

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Generate Prisma Client
      run: npx prisma generate
      shell: bash
