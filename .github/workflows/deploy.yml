name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/andrei25i/marketplace-app-backend
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish-image:
    name: Publish Docker image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          build-args: |
            GIT_SHA=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run database migrations
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/setup
      - name: Apply pending migrations
        run: npx prisma migrate deploy

  deploy:
    name: Deploy to Render
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger Render deploy with the exact image
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS --get "$DEPLOY_HOOK" \
            --data-urlencode "imgURL=${IMAGE}:sha-${SHA}" \
            -o /dev/null
          echo "Deploy triggered for ${IMAGE}:sha-${SHA}"

  smoke-test:
    name: Smoke test production
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Wait for the new version to go live
        run: |
          for i in $(seq 1 60); do
            VERSION=$(curl -fsS "$APP_URL/api/health" | jq -r '.version' || true)
            echo "Attempt $i: live version = ${VERSION:-unreachable}"
            if [ "$VERSION" = "$SHA" ]; then
              echo "New version is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Version $SHA did not go live within 10 minutes"
          exit 1

      - name: Check database connectivity
        run: curl -fsS "$APP_URL/api/health/ready"
